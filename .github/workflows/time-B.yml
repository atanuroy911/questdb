name: optcd-time-B
# Testing PGWire with fixed versions of clients
# This is meant to be run on every PR to catch regressions introduced by QuestDB code changes

on:
- workflow_dispatch

jobs:
  build:
    runs-on:
    - self-hosted
    - optcd
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: 'maven'
    - name: Detect local client profile
      id: client
      uses: ./.github/actions/detect-local-client
    - name: 'mvn: go-offline (untimed)'
      run: mvn -B -q dependency:go-offline || true
    - name: 'mvn: Build distribution'
      run: mvn -B clean install -Dmaven.test.skip=true -Pbuild-binaries -pl '!benchmarks' ${{ steps.client.outputs.client_profile }} -Dexec.skip=true -Dmaven.compiler.excludes=**/io/questdb/cairo/lv/** -Dmaven.compiler.excludes=**/io/questdb/cairo/sql/async/** -Dmaven.compiler.excludes=**/io/questdb/cutlass/auth/** -Dmaven.compiler.excludes=**/io/questdb/cutlass/line/udp/** -Dmaven.compiler.excludes=**/io/questdb/cutlass/pgwire/** -Dmaven.compiler.excludes=**/io/questdb/cutlass/qwp/websocket/** -Dmaven.compiler.excludes=**/io/questdb/metrics/** -Dmaven.compiler.excludes=**/millitime/** -Dmaven.compiler.excludes=io/questdb/cairo/mig/** -Dmaven.compiler.excludes=io/questdb/cutlass/qwp/server/egress/** -Dmaven.compiler.proc=none -Dmaven.compiler.skip=true -Dmaven.compiler.useIncrementalCompilation=false -Dmaven.jar.skip=true
    - name: Unpack distribution
      run: tar -xzf core/target/questdb-*-no-jre-bin.tar.gz
    - name: Start QuestDB
      run: ./questdb-*bin/questdb.sh start
    - name: Setup PHP
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt update
        sudo apt install php php-pdo php-pgsql composer -y
    - name: Setup Rust toolchain
        # 4d1965c9142484e48d40c19de54b5cba84953a06 is the same as @v1, except it's guaranteed to be immutable
        # even if the original tag is moved or deleted
      uses: actions-rust-lang/setup-rust-toolchain@4d1965c9142484e48d40c19de54b5cba84953a06
      with:
        toolchain: 1.90.0
        cache-workspaces: compat/src/test/rust/scenarios
    - name: Setup golang toolchain
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'
        cache-dependency-path: compat/src/test/golang/go.sum
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '9.0.x'
    - name: Setup Python version
      uses: actions/setup-python@v6
      with:
        python-version: 3.8
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
    - name: Run all scenarios
      run: |
        ./compat/src/test/scenarios_stable.sh
    - name: Stop QuestDB
      run: ./questdb-*bin/questdb.sh stop
    - name: Upload logs
      if: failure()   # Only upload logs if the job failed
      uses: actions/upload-artifact@v6
      with:
        path: ~/.questdb/log/*
        name: logs
        retention-days: 5
